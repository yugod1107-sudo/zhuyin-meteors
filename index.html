<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b43"><meta name="description" content="給小朋友的注音鍵盤練習：按對注音，消除隕石，守護星球。"><title>注音隕石 · 保衛星球</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23101b43'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='44' fill='%23a7f3d0'%3Eㄅ%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="meteors.css"><link rel="stylesheet" href="learning.css"><script src="word-groups.js" defer></script><script src="curriculum.js" defer></script><script src="game.js" defer></script></head>
<body><main class="app"><header><a class="brand" href="./"><span class="brand-icon">✦</span><span>注音隕石<small>保 衛 星 球</small></span></a><div class="header-actions"><span class="tag">小小太空人的打字任務</span><button id="sound" class="icon-button" aria-pressed="false">音效：開</button></div></header>
<section class="console"><div class="status"><div><small>星星分數</small><strong id="score">0</strong></div><div><small id="progress-label">任務進度</small><strong id="progress">0 / 10</strong></div><div><small>星球護盾</small><strong id="lives">練習中</strong></div><button id="pause" disabled>暫停</button></div>
<div id="arena" class="arena"><div class="orbit orbit-one"></div><div class="orbit orbit-two"></div><div class="decor-star s1">✧</div><div class="decor-star s2">✦</div><div class="decor-star s3">✧</div><div id="meteors"></div><div id="effects" aria-hidden="true"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div class="ground" aria-label="星球防衛砲塔"><img class="planet-base" src="assets/planet-base.png" alt=""><img id="turret-barrel" class="turret-barrel" src="assets/turret-barrel.png" alt=""><div class="defense-label">星 球 防 線</div></div>
<section id="setup" class="overlay"><div class="intro"><span class="eyebrow">第二版 · 小小太空人</span><h1>注音出擊！<span>一起守護星球</span></h1><p id="lesson-description">先熟悉注音鍵位，再看國字練拼音。</p></div><div class="settings"><div class="lesson-picker" aria-label="學習模式"><button data-lesson="keys" class="selected">注音鍵位</button><button data-lesson="spelling">看字拼音</button></div><fieldset><legend>① 選擇任務</legend><div class="modes"><button data-mode="practice" class="selected"><b>🌱 新手練習</b><small>一次一顆 · 慢慢找</small></button><button data-mode="challenge"><b>🚀 小小挑戰</b><small>兩顆隕石 · 90 秒</small></button><button data-mode="expert"><b>⚡ 太空高手</b><small>三顆隕石 · 90 秒</small></button></div></fieldset><div class="options"><label id="key-range-label">② 練習範圍<select id="range"><option value="all">全部注音 · 37 個</option><option value="initial">聲母 · ㄅ到ㄙ</option><option value="final">介音與韻母 · ㄚ到ㄩ</option><option value="custom">自己選注音</option></select></label><label id="word-range-label" hidden>② 練習內容<select id="word-range"><option value="all">全部生活單字 · 120 字</option><option value="nature">自然天地 · 20 字</option><option value="daily">家人與生活 · 20 字</option></select></label><label id="hints-option" class="check"><input id="hints" type="checkbox" checked> <span id="hints-label">顯示鍵位提示</span></label></div><div id="custom" class="custom" hidden></div><div class="learning-options"><label id="calm-label" class="check"><input id="calm" type="checkbox"> 停住慢慢練</label></div><div class="speed-setting"><label for="speed">③ 隕石速度</label><select id="speed"><option value="0.5">0.5 倍 · 慢慢想</option><option value="1">1 倍 · 標準</option><option value="1.5" selected>1.5 倍 · 輕快</option><option value="2">2 倍 · 快速</option><option value="3">3 倍 · 極速挑戰</option></select><p id="speed-note"></p></div><button id="start" class="primary">開始任務 <span>→</span></button><p id="setup-note" class="setup-note">電腦請切換英文輸入模式；平板可以點下方鍵盤。</p></div></section>
<section id="ready" class="overlay compact" hidden><div class="modal"><span class="eyebrow">出發前，準備一下</span><h2 id="ready-title">找到「ㄅ」</h2><p id="ready-text" class="ready-instructions">請先切換英文輸入模式，再按鍵盤的 1。也可以點下方的「ㄅ」。</p><button id="cancel-ready">返回設定</button></div></section>
<section id="paused" class="overlay compact" hidden><div class="modal"><span class="eyebrow">休息一下</span><h2>星球等你回來</h2><button id="resume" class="primary">繼續任務 →</button><button id="quit">返回首頁</button></div></section>
<section id="result" class="overlay compact" hidden><div class="modal results"><span class="eyebrow">MISSION COMPLETE</span><h2 id="result-title">任務完成！</h2><p id="result-message"></p><div id="stats" class="stats"></div><p id="best"></p><div id="review"></div><div class="result-actions"><button id="again" class="primary">再玩一次</button><button id="retry">再練不熟的注音</button><button id="home">返回首頁</button></div></div></section></div>
<section class="keyboard-section"><div id="learning-bar" class="learning-bar" hidden><div class="target-line"><p id="target-caption">目前目標</p><strong id="target-progress">等待隕石</strong></div></div><div id="keyboard-heading" class="keyboard-heading"><b>我的注音鍵盤</b><span id="keyboard-note">亮起的按鍵，是你的小幫手</span></div><div id="keyboard" class="keyboard" aria-label="注音鍵盤"></div></section></section><footer><span>不用急，每按對一次，就更熟練一點。</span><span>注音鍵位 · 看字拼音</span></footer></main></body></html>
